name: Deploy PR Preview (workflow_run)

on:
  workflow_run:
    workflows: ["Build PR Preview"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  deploy:
    # Only deploy if the build workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Identify PR number from the triggering workflow_run payload
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              core.setFailed("No pull_requests found on workflow_run payload (not a PR run).");
              return;
            }
            core.setOutput("number", prs[0].number);

      # Download artifact from the triggering workflow run
      - name: Download built site artifact
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = context.payload.workflow_run.id;

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id
            });

            const artifact = artifacts.artifacts.find(a => a.name === "pr-preview-site");
            if (!artifact) core.setFailed(`Artifact 'pr-preview-site' not found. Available: ${artifacts.artifacts.map(a=>a.name).join(", ")}`);

            const download = await github.rest.actions.downloadArtifact({
              owner, repo,
              artifact_id: artifact.id,
              archive_format: "zip"
            });

            const fs = require("fs");
            fs.writeFileSync("artifact.zip", Buffer.from(download.data));

      - name: Unzip artifact
        run: |
          unzip -q artifact.zip -d site

      - name: Deploy to gh-pages (PR preview folder)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ github.token }}
          publish_dir: ./site
          destination_dir: previews/pr-${{ steps.pr.outputs.number }}
          keep_files: true

      - name: Comment on PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number("${{ steps.pr.outputs.number }}");
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/previews/pr-${prNumber}/`;

            const body = `## 📚 Documentation preview deployed!

            Preview URL: ${previewUrl}

            (Built from workflow run: ${context.payload.workflow_run.html_url})`;

            // Create or update an existing bot comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.data.find(c =>
              c.user?.type === "Bot" && (c.body || "").includes("📚 Documentation preview deployed!")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
